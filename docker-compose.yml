version: '3.8'

services:
  mcp-filesystem-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-filesystem-agent
    restart: unless-stopped
    environment:
      - MCP_BASE_DIR=/workspace
      - PYTHONUNBUFFERED=1
    volumes:
      - ${MCP_WORKSPACE_PATH:-./workspace}:/workspace:rw
    stdin_open: true
    tty: true
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=mcp-filesystem-agent"
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: mcp-network
    driver: bridge
